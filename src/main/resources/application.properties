spring.application.name=flagtether

server.port=8080


spring.datasource.url=jdbc:postgresql://localhost:5432/flagtether
spring.datasource.username=flagtether_app
spring.datasource.password=${FLAGTETHER_DB_PASSWORD}


spring.flyway.enabled=true

spring.flyway.url=jdbc:postgresql://localhost:5432/flagtether
spring.flyway.user=flagtether_migrator
spring.flyway.password=${FLAGTETHER_DB_MIGRATION_PASSWORD}

spring.flyway.locations=classpath:db/migration

spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=true

spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs