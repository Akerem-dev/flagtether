name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  verify:
    name: Java 21 / Maven Verify

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: mvn --batch-mode clean verify